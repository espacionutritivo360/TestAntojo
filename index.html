<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test ConyRoots | Santuaria · V14</title>
  <style>
:root {
  --cream: #f8f2e8;
  --cream-2: #fffaf2;
  --sage: #8ea68d;
  --sage-dark: #3e5d47;
  --olive: #6e7d52;
  --earth: #ad7e57;
  --gold: #c9a86a;
  --ink: #263229;
  --muted: #667162;
  --white: #ffffff;
  --line: rgba(62, 93, 71, 0.18);
  --shadow: 0 24px 70px rgba(57, 72, 54, 0.18);
  --radius-xl: 32px;
  --radius-lg: 24px;
  --radius-md: 18px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(201,168,106,.32), transparent 34%),
    radial-gradient(circle at bottom right, rgba(142,166,141,.36), transparent 35%),
    linear-gradient(135deg, #f6efe3 0%, #fdf8ef 48%, #edf3ea 100%);
  display: grid;
  place-items: center;
  padding: 20px;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(62,93,71,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(62,93,71,.045) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}

.app-shell {
  width: min(100%, 480px);
  position: relative;
  z-index: 1;
}

.quiz-card {
  width: 100%;
  min-height: 720px;
  background: rgba(255, 250, 242, 0.92);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow);
  padding: 24px;
  backdrop-filter: blur(18px);
  position: relative;
  overflow: hidden;
}

.quiz-card::before {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: rgba(142,166,141,.16);
  top: -90px;
  right: -90px;
}

.quiz-card::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: rgba(201,168,106,.14);
  bottom: -60px;
  left: -60px;
}

.brand-row, .progress-wrap, .screen { position: relative; z-index: 1; }

.brand-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.brand-mark {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--sage-dark), var(--sage));
  color: var(--cream-2);
  display: grid;
  place-items: center;
  font-family: "DM Serif Display", serif;
  font-size: 18px;
  letter-spacing: .5px;
  box-shadow: 0 10px 22px rgba(62,93,71,.22);
}

.eyebrow {
  margin: 0;
  color: var(--sage-dark);
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .11em;
}

.brand-subtitle {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.progress-wrap { margin-bottom: 24px; }

.progress-meta {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}

.progress-track {
  height: 9px;
  background: rgba(62,93,71,.11);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--sage-dark), var(--gold));
  border-radius: 999px;
  transition: width .35s ease;
}

.screen {
  animation: fadeUp .28s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-art {
  height: 180px;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.8), transparent 18%),
    radial-gradient(circle at 68% 28%, rgba(201,168,106,.6), transparent 16%),
    radial-gradient(circle at 50% 58%, rgba(142,166,141,.55), transparent 28%),
    linear-gradient(135deg, rgba(62,93,71,.88), rgba(142,166,141,.65));
  position: relative;
  overflow: hidden;
  margin-bottom: 24px;
}

.hero-art::before, .hero-art::after {
  content: "";
  position: absolute;
  border: 1px solid rgba(255,250,242,.55);
  border-radius: 999px 999px 999px 0;
  transform: rotate(-28deg);
}

.hero-art::before {
  width: 120px;
  height: 54px;
  left: 44px;
  bottom: 42px;
}

.hero-art::after {
  width: 170px;
  height: 72px;
  right: -18px;
  top: 42px;
}

.kicker {
  color: var(--earth);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .11em;
  text-transform: uppercase;
  margin: 0 0 10px;
}

h1, h2 {
  font-family: "DM Serif Display", Georgia, serif;
  font-weight: 400;
  line-height: .98;
  color: var(--ink);
  margin: 0;
}

h1 { font-size: clamp(42px, 10vw, 58px); }
h2 { font-size: clamp(34px, 8vw, 44px); }

.lead {
  color: var(--muted);
  line-height: 1.55;
  font-size: 16px;
  margin: 18px 0 0;
}

.quote-card {
  margin: 22px 0;
  padding: 16px 18px;
  border-radius: var(--radius-md);
  background: rgba(142,166,141,.12);
  border: 1px solid var(--line);
  color: var(--sage-dark);
  font-weight: 600;
  line-height: 1.45;
}

.podcast-quote {
  text-align: center;
  font-style: italic;
  letter-spacing: .01em;
}

.disclaimer {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
  margin: 16px 0 0;
}

.question-title { margin-bottom: 14px; }

.helper {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.45;
  margin: 0 0 18px;
}

.options {
  display: grid;
  gap: 12px;
  margin-top: 18px;
}

.option-btn {
  width: 100%;
  border: 1px solid rgba(62,93,71,.18);
  background: rgba(255,255,255,.7);
  color: var(--ink);
  border-radius: 20px;
  padding: 15px 16px;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 15px;
  line-height: 1.35;
  transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
}

.option-btn:hover, .option-btn:focus {
  transform: translateY(-1px);
  border-color: rgba(62,93,71,.42);
  background: rgba(255,255,255,.92);
  box-shadow: 0 12px 26px rgba(57,72,54,.11);
  outline: none;
}

.option-dot {
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 50%;
  background: rgba(142,166,141,.16);
  display: grid;
  place-items: center;
  color: var(--sage-dark);
  font-weight: 800;
  font-size: 13px;
}

.actions {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 24px;
}

.primary-btn, .secondary-btn {
  border: none;
  border-radius: 999px;
  padding: 15px 20px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
}

.primary-btn {
  flex: 1;
  color: var(--cream-2);
  background: linear-gradient(135deg, var(--sage-dark), var(--olive));
  box-shadow: 0 14px 26px rgba(62,93,71,.22);
}

.secondary-btn {
  color: var(--sage-dark);
  background: rgba(142,166,141,.13);
  border: 1px solid rgba(62,93,71,.16);
}

.primary-btn:hover, .secondary-btn:hover {
  transform: translateY(-1px);
}

.back-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  font-weight: 800;
  padding: 12px 0;
  cursor: pointer;
}

.microcopy {
  margin: 18px 0 0;
  color: var(--earth);
  font-weight: 700;
  font-size: 14px;
}

.result-shell { padding-bottom: 8px; }

.result-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(201,168,106,.14);
  color: var(--earth);
  border: 1px solid rgba(201,168,106,.34);
  padding: 8px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 14px;
}

.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 18px 0;
}

.result-chip {
  border: 1px solid rgba(62,93,71,.16);
  background: rgba(255,255,255,.55);
  border-radius: 16px;
  padding: 12px;
}

.result-chip small {
  display: block;
  color: var(--muted);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 4px;
}

.result-chip span {
  color: var(--ink);
  font-weight: 700;
  font-size: 13px;
}


.result-part-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  color: var(--sage-dark);
  background: rgba(142,166,141,.13);
  border: 1px solid rgba(62,93,71,.14);
  margin: 8px 0 14px;
}
.result-section-card {
  border-radius: 20px;
  padding: 16px 17px;
  margin: 12px 0;
  border: 1px solid rgba(62,93,71,.12);
  line-height: 1.5;
}
.result-section-card p { margin: 7px 0 0; color: var(--ink); font-size: 14px; line-height: 1.55; }
.result-card-title { font-weight: 800; color: var(--sage-dark); font-size: 14px; }
.card-sage { background: rgba(142,166,141,.14); }
.card-blue { background: rgba(147,178,194,.16); }
.card-rose { background: rgba(210,164,158,.15); }
.card-gold { background: rgba(201,168,106,.16); }
.card-lilac { background: rgba(176,157,191,.14); }
.result-nav { margin-top: 22px; }
.result-mini-note { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 10px; }

.loading-card {
  min-height: 430px;
  display: grid;
  place-items: center;
  text-align: center;
}

.pulse-root {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  margin: 0 auto 24px;
  background: radial-gradient(circle, var(--gold) 0 18%, rgba(142,166,141,.5) 19% 44%, rgba(62,93,71,.18) 45% 70%, transparent 71%);
  animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(.96); opacity: .8; }
  50% { transform: scale(1.06); opacity: 1; }
}

.form-group { display: grid; gap: 12px; margin: 20px 0; }

input {
  width: 100%;
  border: 1px solid rgba(62,93,71,.2);
  background: rgba(255,255,255,.72);
  border-radius: 18px;
  padding: 15px 16px;
  font: inherit;
  color: var(--ink);
}

input:focus { outline: 2px solid rgba(142,166,141,.35); }


.goza-btn {
  border: 1px solid rgba(182, 94, 126, .22);
  border-radius: 999px;
  padding: 15px 20px;
  font-weight: 800;
  cursor: pointer;
  color: #6f3650;
  background: linear-gradient(135deg, #f7c9d9, #f2b9cf);
  box-shadow: 0 12px 24px rgba(182, 94, 126, .16);
  transition: transform .18s ease, box-shadow .18s ease;
}
.goza-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 15px 28px rgba(182, 94, 126, .20);
}
.goza-copy {
  background: rgba(247, 201, 217, .20);
  border: 1px solid rgba(182, 94, 126, .12);
  border-radius: 18px;
  padding: 14px 15px;
}


.question-visual, .welcome-visual, .final-visual {
  width: 100%;
  border-radius: var(--radius-lg);
  margin: 0 0 22px;
  background-position: center center;
  background-repeat: no-repeat;
  position: relative;
  overflow: hidden;
  box-shadow: 0 14px 34px rgba(57,72,54,.12);
}

/* Prototipo 14: modo mixto Santuaria.
   Preguntas = imagen completa y clara. Bienvenida/cierre = más editorial. */
.question-visual {
  height: 220px;
  background-size: contain;
  background-color: #f8edf2;
  border: 1px solid rgba(62,93,71,.08);
}
.question-visual::after { display:none; }

.welcome-visual {
  height: 190px;
  background-size: cover;
}
.welcome-visual::after, .final-visual::after {
  content:"";
  position:absolute;
  inset:0;
  background: linear-gradient(180deg, rgba(20,24,20,.02) 15%, rgba(20,24,20,.26) 100%);
}

.final-visual {
  height: 230px;
  background-size: cover;
}

.question-visual .visual-caption {
  background: rgba(255,250,242,.88);
  color: var(--sage-dark);
  text-shadow: none;
  border: 1px solid rgba(62,93,71,.10);
  padding: 7px 10px;
  border-radius: 999px;
  backdrop-filter: blur(8px);
}
.visual-caption {
  position:absolute;
  left:14px;
  bottom:12px;
  z-index:2;
  color:#fffaf2;
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-shadow:0 2px 12px rgba(0,0,0,.35);
}
.app-shell.embed-mode {
  width: min(100%, 520px);
}
body.embed-mode {
  background: transparent;
  padding: 0;
  display:block;
}
body.embed-mode::before { display:none; }
body.embed-mode .quiz-card {
  box-shadow:none;
  border:0;
  min-height:auto;
}
.sync-note {
  font-size: 11px;
  color: var(--muted);
  margin-top: 10px;
  line-height: 1.4;
}

@media (max-width: 420px) {
  body { padding: 10px; }
  .quiz-card { min-height: 100vh; border-radius: 0; padding: 20px; }
  .hero-art { height: 150px; }
  .result-grid { grid-template-columns: 1fr; }
}

  </style>
</head>

          <div class="progress-fill" id="progressFill"></div>

      </div>

      <div id="screen" class="screen"></div>
    </section>
  </main>

function emitToSantuaria(type, detail={}) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      source: "santuaria",
      module: SANTUARIA_MODULE_ID,
      type,
      detail
    }, "*");
  }
}

function getTrafficMeta() {
  const p = new URLSearchParams(window.location.search);
  return {
    utm_source: p.get("utm_source") || "",
    utm_medium: p.get("utm_medium") || "",
    utm_campaign: p.get("utm_campaign") || "",
    utm_content: p.get("utm_content") || "",
    utm_term: p.get("utm_term") || "",
    referrer: document.referrer || "",
    embedded_in_santuaria: window.parent !== window
  };
}

async function sendToGoogleSheets(payload) {
  if (!GOOGLE_APPS_SCRIPT_URL || GOOGLE_APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
    return { status: "pending_configuration" };
  }
  try {
    await fetch(GOOGLE_APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    return { status: "sent" };
  } catch (error) {
    console.warn("No se pudo enviar a Google Sheets:", error);
    return { status: "error" };
  }
}

const screen = document.getElementById("screen");
const progressWrap = document.getElementById("progressWrap");
const stepLabel = document.getElementById("stepLabel");
const progressPercent = document.getElementById("progressPercent");
const progressFill = document.getElementById("progressFill");

let current = -1;
let answers = [];
let scores = { tierra: 0, agua: 0, madera: 0, fuego: 0, metal: 0, silencio: 0 };
let lead = {};
let currentResult = null;

function scrollQuizToTop() {
  requestAnimationFrame(() => {
    const card = document.getElementById("quizCard");
    if (card) {
      card.scrollIntoView({ behavior: "smooth", block: "start" });
    } else {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });
}

function renderStart() {
  progressWrap.hidden = true;
  screen.innerHTML = `
    <div class="welcome-visual" style="background-image:url(${VISUALS.welcome})"><div class="visual-caption">Antojitos · cuerpo · curiosidad</div></div>
    <p class="kicker">Bienvenida</p>
    <h1>¿Qué te está diciendo tu antojo?</h1>
    <p class="lead">Descubre qué desea comunicar tu cuerpo a través de esos antojitos y déjate sorprender.</p>
    <div class="quote-card podcast-quote">♪ Escucharte es el primer paso para sanar y eso es Auténtica Salud. ♪</div>
    <div class="actions">
      <button class="primary-btn" onclick="startQuiz()">Quiero escuchar mi cuerpo</button>
    </div>
    <p class="disclaimer">Este test es orientativo y no reemplaza diagnóstico médico, nutricional ni psicológico.</p>
  `;
  scrollQuizToTop();
}

function startQuiz() {
  current = 0;
  answers = [];
  scores = { tierra: 0, agua: 0, madera: 0, fuego: 0, metal: 0, silencio: 0 };
  renderQuestion();
}

function updateProgress() {
  const percent = Math.round(((current + 1) / questions.length) * 100);
  stepLabel.textContent = `Pregunta ${current + 1} de ${questions.length}`;
  progressPercent.textContent = `${percent}%`;
  progressFill.style.width = `${percent}%`;
}

function renderQuestion() {
  progressWrap.hidden = false;
  updateProgress();
  const q = questions[current];
  const visualKey = `q${current + 1}`;
  screen.innerHTML = `
    <div class="question-visual" style="background-image:url(${VISUALS[visualKey]}); background-color:${QUESTION_VISUAL_BACKGROUNDS[current] || '#f8edf2'};">
      <div class="visual-caption">${VISUAL_CAPTIONS[current] || "Tu cuerpo, tu historia"}</div>
    </div>
    <p class="kicker">Tu cuerpo ya está hablando</p>
    <h2 class="question-title">${q.title}</h2>
    <p class="helper">${q.helper}</p>
    <div class="options">
      ${q.options.map((option, index) => `
        <button class="option-btn" onclick="selectOption(${index})">
          <span class="option-dot">${index + 1}</span>
          <span>${option.text}</span>
        </button>
      `).join("")}
    </div>
    <div class="actions">
      ${current > 0 ? `<button class="back-btn" onclick="goBack()">← Volver</button>` : `<button class="back-btn" onclick="renderStart()">← Inicio</button>`}
    </div>
    <p class="microcopy">Esto no es culpa. Es información.</p>
  `;
  scrollQuizToTop();
}

function selectOption(index) {
  const option = questions[current].options[index];
  answers[current] = {
    question: questions[current].title,
    answer: option.text,
    points: option.points || {},
    tip: option.tip || null,
    comfort: option.comfort || null,
    memory: option.memory || null,
    foodGroup: option.foodGroup || null
  };
  recalcScores();

  if (current < questions.length - 1) {
    current += 1;
    renderQuestion();
  } else {
    renderLoading();
  }
}

function goBack() {
  if (current > 0) {
    current -= 1;
    answers = answers.slice(0, current + 1);
    recalcScores();
    renderQuestion();
  }
}

function recalcScores() {
  scores = { tierra: 0, agua: 0, madera: 0, fuego: 0, metal: 0, silencio: 0 };
  answers.forEach(item => {
    if (!item) return;
    Object.entries(item.points).forEach(([key, value]) => scores[key] += value);
  });
}

function renderLoading() {
  progressWrap.hidden = true;
  screen.innerHTML = `
    <div class="loading-card">
      <div>
        <div class="pulse-root"></div>
        <p class="kicker">Analizando tu patrón</p>

    </div>

  scrollQuizToTop();
  setTimeout(renderLeadForm, 1400);
}

  screen.innerHTML = `

    </form>
    <button class="back-btn" onclick="renderQuestion()">← Volver a revisar respuestas</button>
  `;
  scrollQuizToTop();
}

async function saveLead(event) {
  event.preventDefault();
  const submitButton = event.target.querySelector('button[type="submit"]');
  if (submitButton) {
    submitButton.disabled = true;
    submitButton.textContent = "Preparando tu lectura…";
  }

  const data = new FormData(event.target);
  lead = Object.fromEntries(data.entries());
  const winnerPreview = getWinner();
  const submission = {
    lead,
    answers: answers.map((a, i) => ({
      number: i + 1,
      question: a?.question || "",
      answer: a?.answer || ""
    })),
    scores,
    result: winnerPreview.key,
    secondary_result: winnerPreview.secondary || "",
    date: new Date().toISOString(),
    traffic: getTrafficMeta(),
    source: "Test ConyRoots · Santuaria"
  };

  const saved = JSON.parse(localStorage.getItem("conyroots_test_leads") || "[]");
  saved.push(submission);
  localStorage.setItem("conyroots_test_leads", JSON.stringify(saved));

  const sheetSync = await sendToGoogleSheets(submission);
  localStorage.setItem("conyroots_last_sync_status", JSON.stringify(sheetSync));
  emitToSantuaria("leadSubmitted", submission);

  renderResult();
}

function getWinner() {
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const [firstKey, firstScore] = sorted[0];
  const [secondKey, secondScore] = sorted[1];

  if (scores.silencio >= 6 || firstScore < 5) return { key: "silencio", secondary: null };
  if (secondKey !== "silencio" && firstScore - secondScore <= 1) return { key: firstKey, secondary: secondKey };
  return { key: firstKey, secondary: null };
}

function renderResult() {
  progressWrap.hidden = true;
  const winner = getWinner();
  currentResult = winner;
  const r = results[winner.key];
  const secondary = winner.secondary ? results[winner.secondary] : null;
  const timeTip = answers[1]?.tip || "Observa cuándo aparece tu antojito y qué estaba ocurriendo en tu cuerpo y en tu día.";
  emitToSantuaria("resultReady", { result: winner.key, secondary: winner.secondary || "", scores });

  screen.innerHTML = `
    <div class="result-shell">
      <div class="result-badge">Lectura de tu Antojo</div>
      <div class="result-part-label">Parte 1 de 2 · Comprende tu antojito</div>
      <h2>${r.title}</h2>

  `;
